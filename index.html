<style>
:root{--navy:#2B2D5B;--ink:#3A3C66;--muted:#8D8FAE;--bg:#FFF8F1;--card:#fff;--line:#F1E9E1;
--lav:#B9A8F2;--lav2:#F0ECFF;--mint:#9FDFC2;--mint2:#E5F7EE;--peach:#FFC6A6;--peach2:#FFF0E6;
--sky:#A9D3F2;--sky2:#E7F3FC;--pink:#F6BBD3;--pink2:#FDECF3;--coral:#EFA3A3;--coral2:#FCEBEB;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,sans-serif;font-size:15px}

input:focus,select:focus,textarea:focus{border-color:var(--lav)}

.app{max-width:540px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}

.kidbtn{display:flex;align-items:center;gap:10px;text-align:left;padding:4px 10px 4px 4px;border-radius:999px;background:#fff;box-shadow:0 3px 12px rgba(43,45,91,.07);min-width:0}

nav.bot{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}

.ov{position:fixed;inset:0;background:rgba(43,45,91,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .18s}
.sheet{background:var(--bg);width:100%;max-width:540px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:su .22s ease-out;-webkit-overflow-scrolling:touch}

.sheet h2{font-size:22px;margin-bottom:4px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-10px;background:var(--bg);padding:6px 0 8px;z-index:2}

@keyframes fi{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;z-index:99;box-shadow:0 8px 20px rgba(0,0,0,.18);max-width:88vw;text-align:center;animation:fi .2s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.stat{border-radius:20px;padding:14px}

.empty{text-align:center;padding:18px 10px;color:var(--muted);font-weight:700}
.empty .e{font-size:40px;display:block;margin-bottom:4px}
.bar{height:10px;border-radius:9px;background:#F3EEE9;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px}
.sc{font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-weight:800;font-size:20px;min-width:40px;text-align:right;color:var(--navy)}
.emopick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}

.rrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.rrow input.s{width:78px;flex-shrink:0;text-align:center;font-weight:800}
.x{width:34px;height:34px;border-radius:10px;background:var(--coral2);color:#B04848;font-weight:900;flex-shrink:0}

.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;background:#fff;font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-size:28px;font-weight:800;color:var(--navy);box-shadow:0 3px 12px rgba(43,45,91,.08)}
.logo{width:96px;height:96px;border-radius:28px;box-shadow:0 10px 26px rgba(43,45,91,.18)}
.credit{text-align:center;font-size:12px;color:var(--muted);font-weight:800;margin:18px 0 6px}
.credit b{color:#7A66D9}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{text-align:center;padding:10px 2px;border-radius:18px;background:#FBF8F5}
.badge .b{font-size:30px;display:block}
.badge small{font-size:10.5px;font-weight:800;color:var(--muted);display:block;line-height:1.2;margin-top:2px}
.badge.off{filter:grayscale(1);opacity:.4}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:8px 16px}
.daynav button{width:42px;height:42px;border-radius:14px;background:#fff;font-size:20px;font-weight:900;box-shadow:0 3px 10px rgba(43,45,91,.06)}
.daynav .d{font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-size:19px;font-weight:800;color:var(--navy);text-align:center}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info div{background:#FBF8F5;border-radius:16px;padding:10px 12px}
.info small{display:block;font-size:11.5px;font-weight:800;color:var(--muted)}

.banner{margin:10px 16px;padding:12px 14px;border-radius:18px;font-weight:800;display:flex;gap:10px;align-items:center}
.photo{width:100%;border-radius:16px;margin-top:8px;display:block}
.prog{height:12px;border-radius:9px;background:#F3EEE9;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#9FDFC2,#A9D3F2)}
svg text{font-family:'Nunito',sans-serif;font-weight:700}
.muted{color:var(--muted)}.small{font-size:12.5px}.b8{font-weight:800}
.mt{margin-top:10px}.mt2{margin-top:16px}
.hint{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:6px;line-height:1.45}
a{color:#6650C8;font-weight:800}
</style>

<body>
<div id="app" class="app"></div>
<div id="layer"></div>
<script>
'use strict';
/* =========================================================
   BrightKids — Learn · Grow · Shine
   Created by CreanovativeCo
   Data tersimpan di HP (localStorage + IndexedDB untuk foto)
   ========================================================= */
const APP_VERSION = '1.0.0';
const INVITE_CODES = ['BRIGHTKIDS']; // ganti/tambah kode undangan di sini
const KEY = 'brightkids_v1';
let S, U = {tab:'home', school:'agenda', filter:'up', sday:null, gm:'h', subj:null, unlocked:false, pinBuf:''};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const L = (id, en) => (S && S.lang === 'en') ? en : id;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = n => String(n).padStart(2, '0');
const ds = (d = new Date()) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 86400000);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp' + Math.round(+n || 0).toLocaleString('id-ID');
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const DAY_ID = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const DAY_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON_ID = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MON_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dayName = i => (S.lang === 'en' ? DAY_EN : DAY_ID)[i];
function fmtDate(s, long) {
  if (!s) return '';
  const d = pd(s), M = S.lang === 'en' ? MON_EN : MON_ID;
  return (long ? dayName(d.getDay()) : dayName(d.getDay()).slice(0, 3)) + ', ' + d.getDate() + ' ' + M[d.getMonth()] + (long || d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function countdown(s) {
  const d = diffDays(ds(), s);
  if (d === 0) return ['chip coral', L('Hari ini', 'Today')];
  if (d === 1) return ['chip peach', L('Besok', 'Tomorrow')];
  if (d < 0) return ['chip gray', L('Lewat ' + (-d) + ' hr', (-d) + 'd ago')];
  if (d <= 7) return ['chip', 'H-' + d];
  return ['chip sky', 'H-' + d];
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2300);
}
function ageOf(b) {
  if (!b) return '';
  const d = pd(b), n = new Date(); let y = n.getFullYear() - d.getFullYear(), m = n.getMonth() - d.getMonth();
  if (n.getDate() < d.getDate()) m--; if (m < 0) { y--; m += 12; }
  return L(y + ' th ' + m + ' bln', y + ' y ' + m + ' m');
}
async function hash(s) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('bk::' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 0; for (const c of 'bk::' + s) h = (h * 31 + c.charCodeAt(0)) | 0; return 'f' + h; }
}

/* ---------- storage ---------- */
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S) S = {v:1, lang:'id', invited:false, pin:null, rec:null, activeKid:null, kids:[], lastBackup:null};
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast(L('Memori penuh — hapus beberapa foto atau backup dulu', 'Storage full — remove some photos or back up')); }
}
const PDB = {
  db: null,
  open() { return new Promise((res, rej) => { if (this.db) return res(this.db); const r = indexedDB.open('brightkids_photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('p', mode); const st = t.objectStore('p'); const r = fn(st); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); },
  put(id, v) { return this.tx('readwrite', s => s.put(v, id)); },
  get(id) { return this.tx('readonly', s => s.get(id)); },
  del(id) { return this.tx('readwrite', s => s.delete(id)); },
  async all() { const keys = await this.tx('readonly', s => s.getAllKeys()); const vals = await this.tx('readonly', s => s.getAll()); const o = {}; keys.forEach((k, i) => o[k] = vals[i]); return o; }
};
function compressImage(file, max = 1400, q = .82) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = rej; img.src = url;
  });
}
function pickFile(accept = 'image/*', capture) {
  return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; if (capture) i.setAttribute('capture', 'environment'); i.onchange = () => res(i.files[0] || null); i.click(); });
}

/* ---------- data model ---------- */
function newKid(name) {
  return {id:uid(), profile:{name, nick:'', avatar:'🦁', photo:null, birth:'', gender:'', blood:'', allergy:'', shirt:'', shoe:'', hobby:'', dream:'', favFood:'', favColor:'', nis:'', nisn:'', note:''},
    classes:[], reports:[], agenda:[], schedule:{1:[],2:[],3:[],4:[],5:[],6:[]}, snacks:[], moods:{}, growth:[], achievements:[],
    pocket:{daily:0, goals:[]}, checks:{}, customSubjects:[]};
}
const kid = () => S.kids.find(k => k.id === S.activeKid) || S.kids[0];
function currentClass(k) {
  if (!k.classes.length) return null;
  return [...k.classes].sort((a, b) => (b.year || '').localeCompare(a.year || '') || (+b.grade || 0) - (+a.grade || 0))[0];
}
const classLabel = c => c ? (c.name || (L('Kelas ', 'Grade ') + c.grade)) + (c.school ? ' · ' + c.school : '') : '';

/* ---------- catalogs ---------- */
const SUBJECTS = {
  TK: ['Nilai Agama dan Budi Pekerti','Jati Diri','Literasi','Matematika Dasar','Sains','Seni','Motorik'],
  SD: ['Pendidikan Agama dan Budi Pekerti','Pendidikan Pancasila','Bahasa Indonesia','Matematika','Ilmu Pengetahuan Alam dan Sosial','Seni Budaya dan Prakarya','Pendidikan Jasmani Olahraga dan Kesehatan','Bahasa Inggris','Informatika','Bahasa Arab'],

function lineChart(pts, o = {}) {
  const W = 320, H = o.h || 160, P = {l:34, r:12, t:14, b:26};
  if (!pts.length) return '';
  const ys = pts.map(p => p.y); let mn = o.min ?? Math.min(...ys), mx = o.max ?? Math.max(...ys);
  if (mn === mx) { mn -= 5; mx += 5; } const padv = (mx - mn) * .12; mn = Math.floor(mn - padv); mx = Math.ceil(mx + padv);
  const X = i => P.l + (pts.length === 1 ? (W - P.l - P.r) / 2 : i * (W - P.l - P.r) / (pts.length - 1));
  const Y = v => P.t + (1 - (v - mn) / (mx - mn)) * (H - P.t - P.b);
  const col = o.color || '#8E7CE8';
  let g = ''; for (let i = 0; i <= 3; i++) { const v = mn + (mx - mn) * i / 3; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#F1E9E1" stroke-dasharray="3 4"/><text x="${P.l - 6}" y="${Y(v) + 4}" font-size="10" fill="#A9AAC2" text-anchor="end">${Math.round(v)}</text>`; }
  const path = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const area = path + ` L${X(pts.length - 1)} ${H - P.b} L${X(0)} ${H - P.b} Z`;
  const step = Math.ceil(pts.length / 6);
  const lbl = pts.map((p, i) => (i % step === 0 || i === pts.length - 1) ? `<text x="${X(i)}" y="${H - 8}" font-size="9.5" fill="#A9AAC2" text-anchor="middle">${esc(p.x)}</text>` : '').join('');
  const dots = pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="4.5" fill="#fff" stroke="${col}" stroke-width="2.5"/>` + (pts.length <= 8 ? `<text x="${X(i)}" y="${Y(p.y) - 9}" font-size="10" fill="${o.lc || '#5B47BE'}" text-anchor="middle">${p.y}</text>` : '')).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><defs><linearGradient id="lg${o.id || 0}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#lg${o.id || 0})"/><path d="${path}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}${lbl}</svg>`;
}
function barChart(items, o = {}) {
  const W = 320, H = 150, P = {l:6, r:6, t:18, b:24}; const mx = Math.max(1, ...items.map(i => i.v));
  const bw = (W - P.l - P.r) / items.length;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">` + items.map((it, i) => { const h = (it.v / mx) * (H - P.t - P.b); const x = P.l + i * bw + bw * .18; const y = H - P.b - h;
    return `<rect x="${x}" y="${y}" width="${bw * .64}" height="${Math.max(h, 2)}" rx="7" fill="${it.hi ? '#B9A8F2' : '#FFD3BA'}"/>` + (it.v ? `<text x="${x + bw * .32}" y="${y - 5}" font-size="9" fill="#8D8FAE" text-anchor="middle">${o.fmt ? o.fmt(it.v) : it.v}</text>` : '') + `<text x="${x + bw * .32}" y="${H - 8}" font-size="10.5" fill="#8D8FAE" text-anchor="middle">${esc(it.l)}</text>`; }).join('') + '</svg>';

/* ---------- SNACKS & MOOD ---------- */
function vSnack() {
  const k = kid(); const d = U.sday || ds(); const list = k.snacks.filter(s => s.date === d).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  const spent = list.reduce((a, s) => a + (+s.price || 0), 0); const md = k.moods[d] || {};
  const week = [...Array(7)].map((_, i) => { const x = addDays(d, i - 6); return {l:dayName(pd(x).getDay()).slice(0, 3), v:k.snacks.filter(s => s.date === x).reduce((a, s) => a + (+s.price || 0), 0), hi:x === d}; });
  const wk = week.reduce((a, b) => a + b.v, 0);
  const m30 = k.snacks.filter(s => diffDays(s.date, d) >= 0 && diffDays(s.date, d) < 30); const fav = {}; m30.forEach(s => { const n = s.name.trim().toLowerCase(); fav[n] = fav[n] || {n:s.name, c:0, cat:s.cat}; fav[n].c++; });
  const favs = Object.values(fav).sort((a, b) => b.c - a.c).slice(0, 5);
  let html = `<div class="daynav"><button onclick="A.sday(-1)">‹</button><div class="d">${d === ds() ? L('Hari ini', 'Today') : fmtDate(d)}<div class="small muted">${fmtDate(d, true)}</div></div><button onclick="A.sday(1)" ${d >= ds() ? 'style="opacity:.3" disabled' : ''}>›</button></div>`;
  html += `<div class="card"><div class="hd"><h3>💭 ${L('Mood hari ini', "Today's mood")}</h3>${md.m ? `<span class="chip pink">${moodOf(md.m)[1]} ${L(moodOf(md.m)[2], moodOf(md.m)[3])}</span>` : ''}</div><div class="moods" style="margin-top:0">${MOODS.map(m => `<button class="mood ${md.m === m[0] ? 'on' : ''}" style="background:#FBF8F5" onclick="A.mood('${d}','${m[0]}')">${m[1]}<small>${L(m[2], m[3])}</small></button>`).join('')}</div>
  <input class="mt" id="mnote" value="${esc(md.note || '')}" placeholder="${L('Hal seru hari ini apa? ✨', 'What was fun today? ✨')}" onchange="A.moodNote('${d}',this.value)"></div>`;
  html += `<div class="card"><div class="hd"><h3>🍡 ${L('Jajan', 'Snacks')}</h3><button class="link" onclick="A.snackForm()">＋ ${L('Tambah', 'Add')}</button></div><div class="grid2"><div class="stat bg-peach"><div class="v">${rp(spent)}</div><div class="l">${L('Total jajan', 'Total spent')}</div></div><div class="stat bg-mint"><div class="v">${k.pocket.daily ? rp(k.pocket.daily - spent) : '—'}</div><div class="l">${L('Sisa uang saku', 'Pocket money left')} ${k.pocket.daily ? '' : `· <a onclick="A.pocketForm()">${L('atur', 'set')}</a>`}</div></div></div>
  ${list.length ? list.map(s => { const c = SNACK_CATS.find(x => x[0] === s.cat) || SNACK_CATS[6]; return `<div class="item" onclick="A.snackForm('${s.id}')"><div class="emo bg-peach">${c[1]}</div><div class="grow"><div class="ttl">${esc(s.name)}</div><div class="meta">${s.time ? '🕒 ' + esc(s.time) + ' · ' : ''}${L(c[2], c[3])}${s.place ? ' · 📍 ' + esc(s.place) : ''}</div></div><div class="b8" style="color:var(--navy)">${rp(s.price)}</div></div>`; }).join('') : `<div class="empty"><span class="e">🍽️</span>${L('Belum ada jajan dicatat.', 'No snacks logged.')}</div>`}
  ${k.pocket.daily && spent < k.pocket.daily && k.pocket.goals.length ? `<button class="btn mint block mt" onclick="A.saveRest('${d}',${k.pocket.daily - spent})">🐷 ${L('Tabung sisa ' + rp(k.pocket.daily - spent), 'Save the rest ' + rp(k.pocket.daily - spent))}</button>` : ''}</div>`;
  html += `<div class="card"><div class="hd"><h3>📊 ${L('7 hari terakhir', 'Last 7 days')}</h3><span class="chip peach">${rp(wk)}</span></div>${barChart(week, {fmt:kfmt})}
  ${favs.length ? `<div class="b8 small muted mt">${L('Paling sering (30 hari)', 'Most frequent (30 days)')}</div><div class="chips mt">${favs.map(f => `<span class="chip peach">${(SNACK_CATS.find(x => x[0] === f.cat) || SNACK_CATS[6])[1]} ${esc(f.n)} ×${f.c}</span>`).join('')}</div>` : ''}</div>`;
  html += `<div class="card"><div class="hd"><h3>🐷 ${L('Celengan impian', 'Dream piggy bank')}</h3><button class="link" onclick="A.goalForm()">＋ ${L('Target', 'Goal')}</button></div>
  ${k.pocket.goals.length ? k.pocket.goals.map(g => { const sv = goalSaved(g); const pc = g.target ? Math.min(100, Math.round(sv / g.target * 100)) : 0; return `<div class="item" style="display:block" onclick="A.goalView('${g.id}')"><div class="row"><div class="emo bg-mint">${esc(g.emoji || '🎁')}</div><div class="grow"><div class="ttl">${esc(g.name)} ${pc >= 100 ? '🎉' : ''}</div><div class="meta">${rp(sv)} / ${rp(g.target)} · ${pc}%</div></div></div><div class="prog"><i style="width:${pc}%"></i></div></div>`; }).join('') : `<div class="empty"><span class="e">🐷</span>${L('Mau nabung buat apa? Buat target pertamamu!', 'What are you saving for? Create your first goal!')}</div>`}

const goalSaved = g => (g.deposits || []).reduce((a, d) => a + (+d.amt || 0), 0);

/* ---------- GROWTH ---------- */
function vGrow() {
  const k = kid(); const g = [...k.growth].sort((a, b) => a.date.localeCompare(b.date));
  const lastH = [...g].reverse().find(x => x.h), lastW = [...g].reverse().find(x => x.w);
  const prevH = lastH && [...g].reverse().find(x => x.h && x.date < lastH.date), prevW = lastW && [...g].reverse().find(x => x.w && x.date < lastW.date);
  const dl = (a, b, u) => a && b ? `<span class="chip ${a - b >= 0 ? 'mint' : 'sky'}">${a - b >= 0 ? '▲' : '▼'} ${Math.abs(Math.round((a - b) * 10) / 10)} ${u}</span>` : '';
  const bmi = lastH && lastW ? Math.round(lastW.w / Math.pow(lastH.h / 100, 2) * 10) / 10 : null;
  let html = `<div class="card"><div class="hd"><h3>📏 ${L('Tinggi & berat', 'Height & weight')}</h3><button class="link" onclick="A.growForm()">＋ ${L('Ukur', 'Measure')}</button></div>
  <div class="grid2"><div class="stat bg-sky"><div class="l">📏 ${L('Tinggi', 'Height')}</div><div class="v">${lastH ? lastH.h + ' cm' : '—'}</div>${dl(lastH && lastH.h, prevH && prevH.h, 'cm')}</div><div class="stat bg-lav"><div class="l">⚖️ ${L('Berat', 'Weight')}</div><div class="v">${lastW ? lastW.w + ' kg' : '—'}</div>${dl(lastW && lastW.w, prevW && prevW.w, 'kg')}</div></div>
  ${bmi ? `<div class="hint">IMT/BMI: <b>${bmi}</b> · ${L('Untuk anak, IMT dibaca dengan grafik pertumbuhan sesuai usia — tanyakan ke dokter anak/posyandu bila ragu.', 'For children, BMI is read on age-based growth charts — ask your pediatrician if unsure.')}</div>` : ''}
  ${g.length ? `<div class="chips mt"><button class="${U.gm === 'h' ? 'on' : ''}" onclick="A.gm('h')">📏 ${L('Tinggi', 'Height')}</button><button class="${U.gm === 'w' ? 'on' : ''}" onclick="A.gm('w')">⚖️ ${L('Berat', 'Weight')}</button></div><div class="mt">${lineChart(g.filter(x => x[U.gm]).map(x => ({x:(S.lang === 'en' ? MON_EN : MON_ID)[pd(x.date).getMonth()] + "'" + String(pd(x.date).getFullYear()).slice(2), y:x[U.gm]})), {id:3, color:U.gm === 'h' ? '#6FB7E8' : '#9E8CEB'})}</div>` : `<div class="empty"><span class="e">🌱</span>${L('Catat tinggi & berat tiap bulan untuk melihat pertumbuhan.', 'Log height & weight monthly to see growth.')}</div>`}
  ${g.length ? `<div class="mt">${[...g].reverse().slice(0, 6).map(x => `<div class="item" onclick="A.growForm('${x.id}')"><div class="emo bg-sky" style="width:38px;height:38px;font-size:18px">📅</div><div class="grow"><div class="ttl">${fmtDate(x.date)}</div><div class="meta">${x.h ? '📏 ' + x.h + ' cm' : ''} ${x.w ? '⚖️ ' + x.w + ' kg' : ''} ${x.note ? '· ' + esc(x.note) : ''}</div></div><span class="muted">›</span></div>`).join('')}</div>` : ''}</div>`;
  const ach = [...k.achievements].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  html += `<div class="card"><div class="hd"><h3>🏆 ${L('Prestasi, ekskul & hafalan', 'Achievements, clubs & memorization')}</h3><button class="link" onclick="A.achForm()">＋ ${L('Tambah', 'Add')}</button></div>
  ${ach.length ? ach.map(a => { const kd = ACH_KINDS.find(x => x[0] === a.kind) || ACH_KINDS[5]; return `<div class="item" onclick="A.achForm('${a.id}')"><div class="emo bg-pink">${kd[1]}</div><div class="grow"><div class="ttl">${esc(a.title)}</div><div class="meta">${L(kd[2], kd[3])}${a.level ? ' · ' + esc(a.level) : ''}${a.date ? ' · ' + fmtDate(a.date) : ''}${a.photo ? ' · 📷' : ''}</div></div></div>`; }).join('') : `<div class="empty"><span class="e">🏆</span>${L('Juara lomba, sertifikat, ekskul, hafalan surat — catat semua di sini!', 'Competitions, certificates, clubs, memorization — log them here!')}</div>`}</div>`;
  const md = Object.entries(k.moods).filter(([d]) => diffDays(d, ds()) < 30); const cnt = {}; md.forEach(([, v]) => cnt[v.m] = (cnt[v.m] || 0) + 1);
  if (md.length) html += `<div class="card"><div class="hd"><h3>💭 ${L('Mood 30 hari', 'Mood · 30 days')}</h3><span class="chip pink">🔥 ${moodStreak(k)} ${L('hari beruntun', 'day streak')}</span></div>${Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([m, c]) => { const mm = moodOf(m); return `<div class="row" style="margin:6px 0"><span style="font-size:22px;width:30px">${mm[1]}</span><div class="grow"><div class="bar"><i style="width:${c / md.length * 100}%;background:#F6BBD3"></i></div></div><span class="b8 small" style="width:56px;text-align:right">${c} ${L('hari', 'days')}</span></div>`; }).join('')}</div>`;
  return html;
}

/* =========================================================
   ACTIONS
   ========================================================= */
const A = {
  tab(t) { U.tab = t; render(); window.scrollTo(0, 0); },
  seg(s) { U.school = s; render(); },
  filter(f) { U.filter = f; render(); },
  subj(s) { U.subj = s; render(); },
  gm(m) { U.gm = m; render(); },
  sday(n) { const d = addDays(U.sday || ds(), n); if (d > ds()) return; U.sday = d; render(); },
  toggleLang() { S.lang = S.lang === 'en' ? 'id' : 'en'; save(); render(); },
  invite() { const norm = x => String(x || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); const v = norm($('inv').value); if (v && INVITE_CODES.map(norm).includes(v)) { S.invited = true; save(); render(); } else toast(L('Kode tidak cocok 🙈', 'Code does not match 🙈')); },
  async pinKey(d) {
    if (d === 'del') U.pinBuf = U.pinBuf.slice(0, -1); else if (U.pinBuf.length < 4) U.pinBuf += d;
    render();
    if (U.pinBuf.length === 4) { const ok = (await hash(U.pinBuf)) === S.pin; U.pinBuf = ''; if (ok) { U.unlocked = true; render(); } else { toast(L('PIN salah', 'Wrong PIN')); render(); } }
  },
  pinForgot() {
    openSheet(`<p class="b8">${L('Masukkan kode pemulihan yang muncul saat PIN dibuat.', 'Enter the recovery code shown when the PIN was created.')}</p><input id="rc" placeholder="XXXX-XXXX" autocapitalize="characters"><button class="btn block mt" onclick="A.pinRecover()">${L('Buka & hapus PIN', 'Unlock & remove PIN')}</button>`, '🔑 ' + L('Lupa PIN', 'Forgot PIN'));
  },
  async pinRecover() { const v = ($('rc').value || '').trim().toUpperCase(); if (S.rec && (await hash(v)) === S.rec) { S.pin = null; S.rec = null; U.unlocked = true; save(); closeSheet(); render(); toast(L('PIN dihapus', 'PIN removed')); } else toast(L('Kode salah', 'Wrong code')); },
  pinSetup() {
    openSheet(`<label class="lb">${L('PIN baru (4 angka)', 'New PIN (4 digits)')}</label><input id="p1" inputmode="numeric" maxlength="4" type="password"><label class="lb">${L('Ulangi PIN', 'Repeat PIN')}</label><input id="p2" inputmode="numeric" maxlength="4" type="password">
    <button class="btn block mt2" onclick="A.pinSave()">${L('Simpan PIN', 'Save PIN')}</button>${S.pin ? `<button class="btn danger block mt" onclick="A.pinRemove()">${L('Hapus PIN', 'Remove PIN')}</button>` : ''}`, '🔒 PIN');
  },
  async pinSave() {
    const a = $('p1').value, b = $('p2').value; if (!/^\d{4}$/.test(a)) return toast(L('PIN harus 4 angka', 'PIN must be 4 digits')); if (a !== b) return toast(L('PIN tidak sama', 'PINs do not match'));
    const code = Math.random().toString(36).slice(2, 6).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
    S.pin = await hash(a); S.rec = await hash(code); U.unlocked = true; save();
    openSheet(`<div class="empty"><span class="e">🔑</span></div><p class="b8">${L('Simpan kode pemulihan ini (screenshot/catat). Dipakai kalau lupa PIN:', 'Keep this recovery code (screenshot/write it down). Use it if you forget the PIN:')}</p><div class="hero" style="text-align:center;margin:10px 0"><h1 style="letter-spacing:3px">${code}</h1></div><button class="btn block" onclick="closeSheet()">${L('Sudah kusimpan', 'Saved it')}</button>`, '✅ ' + L('PIN aktif', 'PIN on'));
  },
  pinRemove() { S.pin = null; S.rec = null; save(); closeSheet(); toast(L('PIN dihapus', 'PIN removed')); render(); },
  pickAv(btn, a) { document.querySelectorAll('#avp button').forEach(b => b.classList.remove('on')); btn.classList.add('on'); $('kAv').value = a; },
  lvChange(lv, target) { $(target).innerHTML = GRADES[lv].map(g => `<option>${g}</option>`).join(''); },
  saveKid(id, first) {
    const name = $('kName').value.trim(); if (!name) return toast(L('Nama wajib diisi', 'Name is required'));
    let k = id ? S.kids.find(x => x.id === id) : null;
    if (!k) { k = newKid(name); S.kids.push(k); }
    Object.assign(k.profile, {name, nick:$('kNick').value.trim(), avatar:$('kAv').value, birth:$('kBirth').value});
    if ($('cLv')) { const lv = $('cLv').value; k.classes.push({id:uid(), level:lv, grade:$('cGr').value, name:$('cName').value.trim(), year:$('cYear').value.trim(), school:$('cSchool').value.trim(), teacher:'', phone:''}); }
    S.activeKid = k.id; save(); closeSheet(); U.tab = 'home'; render();
    if (first) toast('🎉 ' + L('Profil dibuat!', 'Profile created!'));
  },
  kidSwitch() {
    openSheet(S.kids.map(k => `<div class="item" onclick="A.useKid('${k.id}')">${avatarHtml(k.profile, 46)}<div class="grow"><div class="ttl">${esc(k.profile.name)}</div><div class="meta">${esc(classLabel(currentClass(k)) || '')}</div></div>${k.id === kid().id ? '<span class="chip mint">✓</span>' : ''}</div>`).join('') +
      `<div class="card" style="margin:14px 0 0">${kidForm({}, true)}<button class="btn block mt2" onclick="A.saveKid(null)">＋ ${L('Tambah anak', 'Add child')}</button></div>`, '👨‍👩‍👧 ' + L('Pilih anak', 'Choose child'));

  async doBackup(all) {
    const kids = all ? S.kids : [kid()]; const photos = await PDB.all().catch(() => ({}));
    const ids = new Set(); kids.forEach(k => { k.reports.forEach(r => r.photo && ids.add(r.photo)); k.achievements.forEach(a => a.photo && ids.add(a.photo)); });
    const data = {app:'BrightKids', v:1, exported:new Date().toISOString(), kids, photos:Object.fromEntries([...ids].filter(i => photos[i]).map(i => [i, photos[i]]))};
    const name = 'BrightKids-' + (all ? 'semua' : kids[0].profile.name.split(' ')[0]) + '-' + ds() + '.json';
    S.lastBackup = ds(); save();
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    try { const file = new File([blob], name, {type:'application/json'}); if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); closeSheet(); render(); return; } } catch (e) { if (e.name === 'AbortError') return; }
    downloadFile(blob, name); closeSheet(); render();
  },
  async restore() {
    const f = await pickFile('.json,application/json'); if (!f) return;
    try {
      const d = JSON.parse(await f.text()); if (d.app !== 'BrightKids' || !Array.isArray(d.kids)) throw 0;
      for (const [k, v] of Object.entries(d.photos || {})) await PDB.put(k, v);
      let added = 0, upd = 0; d.kids.forEach(nk => { const i = S.kids.findIndex(x => x.id === nk.id); if (i >= 0) { S.kids[i] = nk; upd++; } else { S.kids.push(nk); added++; } });
      if (!S.activeKid) S.activeKid = S.kids[0].id; save(); render(); toast('📥 ' + L(added + ' ditambah, ' + upd + ' diperbarui', added + ' added, ' + upd + ' updated'));
    } catch (e) { toast(L('File backup tidak valid', 'Invalid backup file')); }
  },

    out += '\nJAJAN\nTanggal,Jam,Nama,Kategori,Harga,Tempat,Mood hari itu\n'; [...k.snacks].sort((a, b) => a.date.localeCompare(b.date)).forEach(s => out += [s.date, s.time, s.name, s.cat, s.price, s.place, (k.moods[s.date] || {}).m].map(q).join(',') + '\n');

  },
  async shareApp() {
    const url = location.href.split('#')[0].split('?')[0]; const text = L(`Yuk pasang BrightKids 🌟 — catatan sekolah, rapor, tumbuh kembang & jajan anak.\n${url}\nKode undangan: ${INVITE_CODES[0]}`, `Install BrightKids 🌟 — school, report cards, growth & snack tracker for kids.\n${url}\nInvitation code: ${INVITE_CODES[0]}`);
    try { if (navigator.share) return await navigator.share({title:'BrightKids', text}); } catch (e) { if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text); toast('📋 ' + L('Link & kode disalin!', 'Link & code copied!')); } catch (e) { openSheet(`<textarea>${esc(text)}</textarea>`, '📲 Share'); }
  },
  installGuide() {
    openSheet(`<div class="card" style="margin:6px 0"><h3>🍎 iPhone / iPad</h3><ol class="small b8" style="line-height:1.8;padding-left:18px"><li>${L('Buka link aplikasi di <b>Safari</b>', 'Open the app link in <b>Safari</b>')}</li><li>${L('Ketuk tombol Bagikan', 'Tap the Share button')} <b>⬆️</b></li><li>${L('Pilih <b>Tambah ke Layar Utama</b>', 'Choose <b>Add to Home Screen</b>')}</li><li>${L('Ketuk <b>Tambah</b> — ikon BrightKids muncul ✨', 'Tap <b>Add</b> — the BrightKids icon appears ✨')}</li></ol></div>
    <div class="card" style="margin:10px 0"><h3>🤖 Android</h3><ol class="small b8" style="line-height:1.8;padding-left:18px"><li>${L('Buka link di <b>Chrome</b>', 'Open the link in <b>Chrome</b>')}</li><li>${L('Ketuk menu <b>⋮</b>', 'Tap the <b>⋮</b> menu')}</li><li>${L('Pilih <b>Instal aplikasi</b> / <b>Tambahkan ke layar utama</b>', 'Choose <b>Install app</b> / <b>Add to Home screen</b>')}</li></ol></div>
    <div class="hint">💡 ${L('Data tersimpan di HP masing-masing. Rutin backup (menu Aku → Backup), terutama sebelum ganti HP.', "Data stays on each phone. Back up regularly (Me → Backup), especially before changing phones.")}</div>`, '📖 ' + L('Cara pasang', 'How to install'));
  }
};
function schedRow(r) { return `<div class="card" style="margin:0 0 8px;padding:12px"><div class="rrow"><input class="ss" list="dlS" value="${esc(r.subject || '')}" placeholder="${L('Mapel', 'Subject')}"><button class="x" onclick="this.closest('.card').remove()">✕</button></div><div class="grid2"><input class="st" value="${esc(r.time || '')}" placeholder="🕒 07.30–09.00"><input class="sb" value="${esc(r.bring || '')}" placeholder="🎒 ${L('bawa…', 'bring…')}"></div></div>`; }
function repRow(x) { return `<div class="rrow"><input class="rs" list="dlS" value="${esc(x.subject || '')}" placeholder="${L('Mapel', 'Subject')}"><input class="s" inputmode="decimal" value="${x.score ?? ''}" placeholder="0–100"><button class="x" onclick="this.parentNode.remove()">✕</button></div>`; }
function specRow(s) { return `<div class="card" style="margin:0 0 8px;padding:12px"><div class="rrow"><input class="kn" value="${esc(s.name || '')}" placeholder="Tahsin / Tahfidz"><input class="kd" value="${esc(s.detail || '')}" placeholder="${L('Jilid / Surat', 'Level / Surah')}" style="width:42%"><button class="x" onclick="this.closest('.card').remove()">✕</button></div><textarea class="kx" style="min-height:60px" placeholder="${L('Deskripsi dari guru', "Teacher's description")}">${esc(s.desc || '')}</textarea></div>`; }
function allSubjects(k) {
  const set = new Set(); const lv = (currentClass(k) || {}).level || 'SD';
  (SUBJECTS[lv] || []).forEach(s => set.add(s)); k.customSubjects.forEach(s => set.add(s));
  Object.values(k.schedule).flat().forEach(r => r.subject && set.add(r.subject)); k.agenda.forEach(a => a.subject && set.add(a.subject));
  [...SUBJECTS.SD, ...SUBJECTS.SMP, ...SUBJECTS.SMA, ...SUBJECTS.EXTRA].forEach(s => set.add(s));
  return [...set];
}
function gcalUrl(a) {
  const d = a.date.replace(/-/g, ''); let dates;
  if (a.time) { const t = a.time.replace(':', '') + '00'; dates = d + 'T' + t + '/' + d + 'T' + pad2((+a.time.slice(0, 2) + 1) % 24) + a.time.slice(3) + '00'; } else dates = d + '/' + addDays(a.date, 1).replace(/-/g, '');
  const T = TYPES[a.type] || TYPES.info;
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(T.e + ' ' + (kid().profile.nick || kid().profile.name) + ': ' + a.title) + '&dates=' + dates + '&details=' + encodeURIComponent(((a.bring || []).length ? 'Bawa: ' + a.bring.join(', ') + '\n\n' : '') + (a.notes || ''));
}
function downloadFile(content, name, type) {
  const blob = content instanceof Blob ? content : new Blob([content], {type});
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ---------- boot ---------- */
load(); document.documentElement.lang = S.lang; render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) { hiddenAt = Date.now(); return; } if (S.pin && U.unlocked && Date.now() - hiddenAt > 120000) { U.unlocked = false; closeSheet(); render(); } });
</script>
